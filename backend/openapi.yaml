      - is_following_author
      - pending_friend_request
      properties:
        is_friend:
          type: boolean
        is_following_author:
          type: boolean
        pending_friend_request:
          anyOf:
          - $ref: '#/components/schemas/PendingFriendRequest'
          - type: 'null'
      description: Отношения текущего пользователя с владельцем профиля. Для своего профиля флаги false, заявка
        null. При установленной дружбе ожидающей заявки нет.
    PublicProfile:
      allOf:
      - $ref: '#/components/schemas/Profile'
      - type: object
        required:
        - relationship
        properties:
          relationship:
            $ref: '#/components/schemas/UserRelationship'
    SelfProfile:
      allOf:
      - $ref: '#/components/schemas/Profile'
      - type: object
        required:
        - login
        - premium_until
        properties:
          login:
            $ref: '#/components/schemas/Login'
          premium_until:
            anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    RegisterRequest:
      type: object
      required:
      - login
      - password
      - display_name
      - age
      properties:
        login:
          $ref: '#/components/schemas/Login'
        password:
          $ref: '#/components/schemas/Password'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        age:
          type: integer
          minimum: 18
          description: Возраст в полных годах. Значение младше 18 отклоняется с AGE_RESTRICTED. Возраст проверяется
            при регистрации и не сохраняется.
      additionalProperties: false
    LoginRequest:
      type: object
      required:
      - login
      - password
      properties:
        login:
          $ref: '#/components/schemas/Login'
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      additionalProperties: false
    AuthSession:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          minLength: 1
          description: Непрозрачный для клиента токен доступа.
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Срок действия токена в секундах с момента выдачи.
    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          $ref: '#/components/schemas/DisplayName'
        avatar_url:
          $ref: '#/components/schemas/AvatarUrl'
        bio:
          $ref: '#/components/schemas/Bio'
      description: Пропущенные поля сохраняют значения. null очищает аватар, пустая строка очищает bio.
      additionalProperties: false
      minProperties: 1
    FavoriteBook:
      type: object
      required:
      - id
      - title
      - author
      - position
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          $ref: '#/components/schemas/BookTitle'
        author:
          $ref: '#/components/schemas/BookAuthor'
        position:
          $ref: '#/components/schemas/Position'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CreateFavoriteBookRequest:
      type: object
      required:
      - title
      - author
      - position
      properties:
        title:
          $ref: '#/components/schemas/BookTitle'
        author:
          $ref: '#/components/schemas/BookAuthor'
        position:
          $ref: '#/components/schemas/Position'
      additionalProperties: false
    UpdateFavoriteBookRequest:
      type: object
      properties:
        title:
          $ref: '#/components/schemas/BookTitle'
        author:
          $ref: '#/components/schemas/BookAuthor'
        position:
          $ref: '#/components/schemas/Position'
      description: Пропущенные поля не изменяются. position задаёт порядок отображения.
      additionalProperties: false
      minProperties: 1
    CreateThreadRequest:
      type: object
      required:
      - book_title
      - book_author
      - title
      - body
      - total_pages
      - required_pages
      properties:
        book_title:
          $ref: '#/components/schemas/BookTitle'
        book_author:
          $ref: '#/components/schemas/BookAuthor'
        title:
          $ref: '#/components/schemas/ThreadTitle'
        body:
          $ref: '#/components/schemas/MessageBody'
        total_pages:
          $ref: '#/components/schemas/TotalPages'
        required_pages:
          $ref: '#/components/schemas/RequiredPages'
      description: Клиент передаёт исходные числа страниц, а не процент. required_pages не должен превышать total_pages.
        Для всей книги клиент передаёт одинаковые значения этих полей.
      additionalProperties: false
    ThreadSummary:
      type: object
      required:
      - id
      - author
      - book_title
      - book_author
      - title
      - total_pages
      - required_pages
      - spoiler_level
      - is_followed_directly
      - is_followed_via_author
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        author:
          $ref: '#/components/schemas/UserSummary'
        book_title:
          $ref: '#/components/schemas/BookTitle'
        book_author:
          $ref: '#/components/schemas/BookAuthor'
        title:
          $ref: '#/components/schemas/ThreadTitle'
        total_pages:
          $ref: '#/components/schemas/TotalPages'
        required_pages:
          $ref: '#/components/schemas/RequiredPages'
        spoiler_level:
          type: number
          minimum: 0
          maximum: 100
          readOnly: true
          description: Вычисляемый процент required_pages / total_pages * 100. Предназначен для отображения; доступность
            проверяется по исходным значениям без предварительного округления.
        is_followed_directly:
          type: boolean
        is_followed_via_author:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    Thread:
      allOf:
      - $ref: '#/components/schemas/ThreadSummary'
      - type: object
        required:
        - body
        properties:
          body:
            $ref: '#/components/schemas/MessageBody'
    ReadingContext:
      type: object
      required:
      - book_title
      - book_author
      - reading_progress
      properties:
        book_title:
          $ref: '#/components/schemas/BookTitle'
        book_author:
          $ref: '#/components/schemas/BookAuthor'
        reading_progress:
          $ref: '#/components/schemas/ReadingProgress'
      description: Прогресс для одной книги. Соответствие треду определяется по паре book_title и book_author после
        удаления крайних пробелов и приведения к нижнему регистру. Приблизительное совпадение названия не используется
        для переноса прогресса. Контекст не сохраняется.
      additionalProperties: false
    SearchThreadsRequest:
      type: object
      properties:
        book_title:
          $ref: '#/components/schemas/BookTitle'
        book_author:
          $ref: '#/components/schemas/BookAuthor'
        author_id:
          $ref: '#/components/schemas/Id'
        followed_only:
          type: boolean
          default: false
          description: Только явно отслеживаемые треды и треды отслеживаемых авторов, без повторений.
        spoiler_protection:
          $ref: '#/components/schemas/SpoilerProtection'
        reading_contexts:
          type: array
          items:
            $ref: '#/components/schemas/ReadingContext'
          maxItems: 1000
          default: []
          description: Не более одного контекста для каждой нормализованной пары названия и автора. Дубликаты отклоняются
            с DUPLICATE_READING_CONTEXT. Для книги без контекста прогресс равен 0. При выключенной защите контексты
            не влияют на выдачу, но проходят валидацию.
        limit:
          $ref: '#/components/schemas/PageSize'
        cursor:
          $ref: '#/components/schemas/Cursor'
      additionalProperties: false
    Comment:
      type: object
      required:
      - id
      - thread_id
      - author
      - body
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        thread_id:
          $ref: '#/components/schemas/Id'
        author:
          $ref: '#/components/schemas/UserSummary'
        body:
          $ref: '#/components/schemas/MessageBody'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CreateCommentRequest:
      type: object
      required:
      - body
      properties:
        body:
          $ref: '#/components/schemas/MessageBody'
      additionalProperties: false
    AuthorSubscription:
      type: object
      required:
      - author
      - created_at
      properties:
        author:
          $ref: '#/components/schemas/UserSummary'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    FriendRequestStatus:
      type: string
      enum:
      - pending
      - accepted
      - declined
    FriendRequest:
      type: object
      required:
      - id
      - sender
      - recipient
      - status
      - created_at
      - responded_at
      properties:
        id:
          $ref: '#/components/schemas/Id'
        sender:
          $ref: '#/components/schemas/UserSummary'
        recipient:
          $ref: '#/components/schemas/UserSummary'
        status:
          $ref: '#/components/schemas/FriendRequestStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        responded_at:
          anyOf:
          - $ref: '#/components/schemas/Timestamp'
          - type: 'null'
      description: responded_at равно null только для pending. Принятие или отклонение устанавливает время ответа.
        Завершённая заявка сохраняет статус после прекращения дружбы; текущее состояние дружбы определяется отдельно.
      allOf:
      - if:
          properties:
            status:
              const: pending
          required:
          - status
        then:
          properties:
            responded_at:
              type: 'null'
        else:
          properties:
            responded_at:
              $ref: '#/components/schemas/Timestamp'
    CreateFriendRequest:
      type: object
      required:
      - recipient_id
      properties:
        recipient_id:
          $ref: '#/components/schemas/Id'
      additionalProperties: false
    RespondToFriendRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - accepted
          - declined
      additionalProperties: false
    Friendship:
      type: object
      required:
      - friend
      - created_at
      properties:
        friend:
          $ref: '#/components/schemas/UserSummary'
        created_at:
          $ref: '#/components/schemas/Timestamp'
      description: Взаимная дружба. friend — другой участник, created_at — время установления дружбы.
    FavoriteBookPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteBook'
          maxItems: 100
        next_cursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
      description: next_cursor равен null на последней странице. Число элементов не превышает запрошенный limit.
    ThreadPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ThreadSummary'
          maxItems: 100
        next_cursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
      description: next_cursor равен null на последней странице. Число элементов не превышает запрошенный limit.
    CommentPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
          maxItems: 100
        next_cursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
      description: next_cursor равен null на последней странице. Число элементов не превышает запрошенный limit.
    AuthorSubscriptionPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthorSubscription'
          maxItems: 100
        next_cursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
      description: next_cursor равен null на последней странице. Число элементов не превышает запрошенный limit.
    FriendRequestPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FriendRequest'
          maxItems: 100
        next_cursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
      description: next_cursor равен null на последней странице. Число элементов не превышает запрошенный limit.
    FriendshipPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Friendship'
          maxItems: 100
        next_cursor:
          anyOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
      description: next_cursor равен null на последней странице. Число элементов не превышает запрошенный limit.
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          description: Поле запроса с префиксом body, query или path; например body.required_pages.
        message:
          type: string
    Error:
      type: object
      required:
      - code
      - message
      - fields
      properties:
        code:
          type: string
          enum:
          - INVALID_JSON
          - INVALID_ARGUMENT
          - INVALID_CURSOR
          - VALIDATION_FAILED
          - AGE_RESTRICTED
          - INVALID_CREDENTIALS
          - UNAUTHORIZED
          - FORBIDDEN
          - NOT_FOUND
          - LOGIN_TAKEN
          - PREMIUM_REQUIRED
          - SPOILER_BLOCKED
          - FRIEND_REQUEST_PENDING
          - ALREADY_FRIENDS
          - FRIEND_REQUEST_RESOLVED
          - SELF_ACTION_NOT_ALLOWED
          - DUPLICATE_READING_CONTEXT
          - INTERNAL_ERROR
        message:
          type: string
          description: Понятное пользователю описание ошибки. Логика клиента опирается на code, а не на текст.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Ошибки отдельных полей; пустой массив, если ошибка не относится к конкретному полю.
